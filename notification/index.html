<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notification Command Center - Sri Sri Radha Krishna Chandra</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Hind:wght@400;500;600;700&family=Rozha+One&display=swap" rel="stylesheet">

<style>
:root{
  --night:#1A0526;
  --plum:#2E0B45;
  --magenta:#E0115F;
  --marigold:#FFB000;
  --saffron:#FF6A00;
  --peacock:#00A6A6;
  --lotus:#FF8FB8;
  --cream:#FFF1D0;
  --ink:#12031C;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Hind',sans-serif;
  color:var(--cream);
  min-height:100vh;
  padding:0 0 60px;
  background:
    radial-gradient(circle at 12% 8%, rgba(224,17,95,.45), transparent 38%),
    radial-gradient(circle at 92% 22%, rgba(0,166,166,.35), transparent 36%),
    radial-gradient(circle at 50% 100%, rgba(255,106,0,.35), transparent 45%),
    repeating-linear-gradient(45deg, rgba(255,176,0,.06) 0 2px, transparent 2px 18px),
    repeating-linear-gradient(-45deg, rgba(255,143,184,.05) 0 2px, transparent 2px 18px),
    var(--night);
  background-attachment:fixed;
  overflow-x:hidden;
}

/* ---------- Ticker ---------- */
.ticker{
  background:repeating-linear-gradient(90deg,var(--magenta) 0 40px,var(--saffron) 40px 80px,var(--marigold) 80px 120px,var(--peacock) 120px 160px);
  border-bottom:4px solid var(--ink);
  overflow:hidden;white-space:nowrap;
  font-family:'Yatra One',serif;
  color:var(--ink);font-size:.95rem;padding:7px 0;
}
.ticker span{display:inline-block;padding-left:100%;animation:scroll 28s linear infinite}
@keyframes scroll{to{transform:translateX(-100%)}}

/* ---------- Language switch ---------- */
.lang-bar{
  display:flex;justify-content:center;gap:0;
  max-width:340px;margin:18px auto 0;
  background:var(--ink);border:3px solid var(--marigold);border-radius:999px;
  padding:4px;box-shadow:4px 4px 0 var(--magenta);
  position:relative;z-index:2;
}
.lang-bar button{
  flex:1;font:700 .95rem 'Hind',sans-serif;
  color:var(--lotus);background:transparent;border:0;border-radius:999px;
  padding:8px 6px;cursor:pointer;transition:background .15s,color .15s;
}
.lang-bar button.on{background:var(--marigold);color:var(--ink)}

/* ---------- Hero ---------- */
.hero{
  position:relative;text-align:center;
  padding:30px 18px 30px;
  max-width:1180px;margin:0 auto;
}
.mandala{
  position:absolute;left:50%;top:50%;
  width:min(560px,120vw);aspect-ratio:1;
  transform:translate(-50%,-50%);
  opacity:.22;z-index:0;pointer-events:none;
  animation:spin 90s linear infinite;
}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.hero>*:not(.mandala){position:relative;z-index:1}
.hero .om{font-size:2.2rem;filter:drop-shadow(0 0 12px var(--marigold))}
.hero h1{
  font-family:'Yatra One',serif;font-weight:400;
  font-size:clamp(2rem,6.5vw,4.2rem);line-height:1.1;
  color:var(--marigold);
  text-shadow:3px 3px 0 var(--magenta),6px 6px 0 var(--ink);
  margin:6px 0 10px;
}
.hero p{
  display:inline-block;font-weight:700;font-size:1rem;
  background:var(--ink);color:var(--lotus);
  border:2px solid var(--marigold);border-radius:999px;padding:6px 20px;
}
.status-chip{
  display:inline-flex;align-items:center;gap:8px;
  margin-top:14px;font-weight:700;font-size:.85rem;
  background:var(--peacock);color:var(--ink);
  padding:6px 16px;border-radius:999px;border:2px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);
}
.status-chip i{width:10px;height:10px;border-radius:50%;background:#B6FF5C;box-shadow:0 0 0 3px rgba(182,255,92,.35);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(182,255,92,0)}}

/* ---------- Layout ---------- */
.wrap{
  max-width:1180px;margin:0 auto;padding:0 16px;
  display:grid;grid-template-columns:1.15fr .85fr;gap:28px;
}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}

.panel{
  position:relative;
  background:linear-gradient(160deg,rgba(255,255,255,.05),transparent 40%),var(--plum);
  border:3px solid var(--marigold);border-radius:26px;
  padding:26px 22px 24px;
  box-shadow:0 0 0 6px var(--ink),0 0 0 9px var(--magenta),10px 14px 0 9px var(--ink);
  margin-bottom:16px;
}
.panel::before,.panel::after{
  content:"❁";position:absolute;font-size:1.6rem;color:var(--marigold);
  background:var(--ink);border:2px solid var(--marigold);border-radius:50%;
  width:38px;height:38px;display:grid;place-items:center;
}
.panel::before{top:-20px;left:22px}
.panel::after{top:-20px;right:22px;color:var(--lotus)}
.panel h2{
  font-family:'Yatra One',serif;font-weight:400;
  font-size:1.5rem;color:var(--lotus);
  margin:6px 0 20px;padding-bottom:12px;
  border-bottom:3px dotted var(--marigold);
  display:flex;align-items:center;gap:10px;
}

/* ---------- Form ---------- */
label,.lbl{display:block;font-weight:700;font-size:.95rem;color:var(--marigold);margin:0 0 8px}
.field{margin-bottom:20px}
input,textarea{
  width:100%;font:600 1rem 'Hind',sans-serif;color:var(--ink);
  background:var(--cream);border:3px solid var(--ink);border-radius:14px;
  padding:12px 14px;outline:none;
  box-shadow:4px 4px 0 var(--saffron);
  transition:box-shadow .15s,transform .15s;
}
textarea{resize:vertical;min-height:92px}
input:focus,textarea:focus{
  box-shadow:4px 4px 0 var(--magenta),0 0 0 4px var(--marigold);
  transform:translate(-1px,-1px);
}
input::placeholder,textarea::placeholder{color:#8a6a86;font-weight:500}
.hidden{display:none!important}
:focus-visible{outline:3px solid var(--lotus);outline-offset:3px}

/* ---------- Segmented action switch ---------- */
.seg{
  display:grid;grid-template-columns:1fr 1fr;gap:0;
  background:var(--ink);border:3px solid var(--marigold);
  border-radius:16px;padding:4px;margin-bottom:14px;
}
.seg button{
  font:700 .95rem 'Hind',sans-serif;color:var(--lotus);
  background:transparent;border:0;border-radius:11px;padding:11px 6px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:background .15s,color .15s;
}
.seg button.on{background:linear-gradient(100deg,var(--marigold),var(--saffron));color:var(--ink)}

/* ---------- Native-style app screen picker ---------- */
.appshell{
  background:#F6EEFB;color:#1B1030;
  border:3px solid var(--ink);border-radius:22px;overflow:hidden;
  box-shadow:5px 5px 0 var(--peacock);
}
.appbar{
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(100deg,var(--saffron),var(--magenta));
  color:#fff;padding:12px 14px;
}
.appbar .logo{
  width:30px;height:30px;border-radius:50%;background:#fff;
  display:grid;place-items:center;font-size:1rem;
}
.appbar b{font-family:'Yatra One',serif;font-weight:400;font-size:1.05rem;flex:1;line-height:1.1}
.appbar small{font-size:.7rem;font-weight:700;opacity:.9;background:rgba(0,0,0,.22);border-radius:999px;padding:3px 9px}
.apphint{padding:12px 14px 4px;font-size:.82rem;font-weight:700;color:#6b4d86}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 14px 16px}
.tile{
  position:relative;text-align:left;cursor:pointer;
  font-family:'Hind',sans-serif;color:#1B1030;
  background:#fff;border:2.5px solid #E4D5F0;border-radius:18px;
  padding:14px 12px 12px;
  box-shadow:0 3px 0 #E4D5F0;
  transition:transform .12s,box-shadow .12s,border-color .12s,background .12s;
}
.tile:active{transform:scale(.95)}
.tile .ic{
  width:46px;height:46px;border-radius:14px;
  display:grid;place-items:center;font-size:1.5rem;margin-bottom:9px;
}
.tile .nm{font-weight:700;font-size:.92rem;line-height:1.25}
.tile .ck{
  position:absolute;top:9px;right:9px;width:22px;height:22px;border-radius:50%;
  background:#E4D5F0;color:transparent;display:grid;place-items:center;font-size:.75rem;font-weight:700;
}
.tile.on{border-color:var(--magenta);background:#FFF0F6;box-shadow:0 3px 0 var(--magenta)}
.tile.on .ck{background:var(--magenta);color:#fff}
.tile:nth-child(1) .ic{background:#FFE3C2}
.tile:nth-child(2) .ic{background:#FFD3E3}
.tile:nth-child(3) .ic{background:#CFF3F1}
.tile:nth-child(4) .ic{background:#E3DAFF}
.tile:nth-child(5) .ic{background:#FFF0B8}

/* ---------- Send ---------- */
.send{
  width:100%;margin-top:6px;
  font:400 1.35rem 'Yatra One',serif;color:var(--ink);
  background:linear-gradient(100deg,var(--marigold),var(--saffron) 50%,var(--magenta));
  border:3px solid var(--ink);border-radius:18px;padding:16px;cursor:pointer;
  box-shadow:6px 6px 0 var(--ink),6px 6px 0 3px var(--marigold);
  transition:transform .12s,box-shadow .12s;
  display:flex;justify-content:center;align-items:center;gap:10px;
}
.send:hover{transform:translate(-2px,-2px)}
.send:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.send:disabled{opacity:.65;cursor:not-allowed}

/* ---------- Diagnostics ---------- */
.diag{
  margin-top:20px;padding:14px 16px;border-radius:16px;
  border:3px solid var(--ink);background:var(--cream);color:var(--ink);
  box-shadow:5px 5px 0 var(--peacock);font-weight:600;
}
.diag.ok{box-shadow:5px 5px 0 #2DBE60}
.diag.err{box-shadow:5px 5px 0 var(--magenta);background:#FFE1E8}
.diag strong{font-family:'Yatra One',serif;font-weight:400;font-size:1.1rem;display:block}
.diag small{display:block;margin-top:4px;opacity:.8}

/* ---------- Phone preview ---------- */
.phone{
  max-width:340px;margin:0 auto;background:var(--ink);
  border:4px solid var(--marigold);border-radius:38px;padding:16px 12px 20px;
  box-shadow:0 0 0 5px var(--peacock),8px 10px 0 5px var(--ink);
  background-image:radial-gradient(circle at 20% 0%,rgba(224,17,95,.5),transparent 55%),radial-gradient(circle at 90% 100%,rgba(0,166,166,.45),transparent 55%);
}
.phone .cam{width:14px;height:14px;background:#000;border:2px solid #3b2a50;border-radius:50%;margin:0 auto 12px}
.phone .clock{text-align:center;font-family:'Rozha One',serif;font-size:2.6rem;color:var(--cream);line-height:1}
.phone .date{text-align:center;font-size:.8rem;margin:2px 0 14px;color:var(--lotus);font-weight:600}
.notif{background:#F7EEFF;color:#1B1030;border-radius:20px;padding:12px 14px 14px;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.notif-top{display:flex;align-items:center;gap:8px;font-size:.74rem;font-weight:700;color:#5b4a73;margin-bottom:8px}
.notif-icon{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--saffron),var(--magenta));display:grid;place-items:center;font-size:.7rem;color:#fff}
.notif-title{font-weight:700;font-size:1rem;line-height:1.3;margin-bottom:3px;word-break:break-word}
.notif-body{font-size:.86rem;line-height:1.4;color:#43365a;word-break:break-word;white-space:pre-wrap}
.notif-img{display:none;width:100%;height:150px;object-fit:cover;border-radius:12px;margin-top:10px;background:#d9cbe8}
.tap-chip{
  margin:16px auto 0;max-width:300px;background:var(--marigold);color:var(--ink);
  border:3px solid var(--ink);border-radius:14px;padding:9px 12px;
  font-weight:700;font-size:.86rem;text-align:center;box-shadow:4px 4px 0 var(--magenta);
}

/* ---------- History ---------- */
.hist-head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}
.hist-head b{font-family:'Yatra One',serif;font-weight:400;font-size:1.15rem;color:var(--marigold)}
.hist-head button{font:700 .8rem 'Hind',sans-serif;background:var(--ink);color:var(--lotus);border:2px solid var(--lotus);border-radius:999px;padding:3px 14px;cursor:pointer}
.hist{display:flex;flex-direction:column;gap:10px;max-height:260px;overflow-y:auto;padding:2px 6px 6px 2px}
.hist-item{
  display:flex;justify-content:space-between;gap:10px;align-items:center;
  background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:14px;
  padding:9px 12px;box-shadow:3px 3px 0 var(--peacock);
}
.hist-item.fail{box-shadow:3px 3px 0 var(--magenta)}
.hist-item .t{font-weight:700;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.hist-item .s{font-size:.75rem;font-weight:600;color:#5b4a73}
.hist-item .tm{font-size:.72rem;font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--lotus);font-weight:600;padding:12px}

@media (prefers-reduced-motion:reduce){
  .ticker span,.mandala,.status-chip i{animation:none}
  .ticker span{padding-left:12px}
}
</style>
</head>
<body>

<div class="ticker"><span id="tickerText"></span></div>

<div class="lang-bar" role="group" aria-label="Language">
  <button type="button" data-lang="hi" onclick="setLang('hi')">हिंदी</button>
  <button type="button" data-lang="mr" onclick="setLang('mr')">मराठी</button>
  <button type="button" data-lang="en" onclick="setLang('en')">English</button>
</div>

<header class="hero">
  <svg class="mandala" viewBox="0 0 200 200" aria-hidden="true">
    <g fill="none" stroke="#FFB000" stroke-width=".8">
      <circle cx="100" cy="100" r="96"/><circle cx="100" cy="100" r="78" stroke-dasharray="3 3"/>
      <circle cx="100" cy="100" r="58"/><circle cx="100" cy="100" r="36" stroke="#E0115F"/>
      <g id="petal"><path d="M100 4 C118 34 118 64 100 100 C82 64 82 34 100 4Z" stroke="#FF8FB8"/></g>
      <use href="#petal" transform="rotate(30 100 100)"/><use href="#petal" transform="rotate(60 100 100)"/>
      <use href="#petal" transform="rotate(90 100 100)"/><use href="#petal" transform="rotate(120 100 100)"/>
      <use href="#petal" transform="rotate(150 100 100)"/><use href="#petal" transform="rotate(180 100 100)"/>
      <use href="#petal" transform="rotate(210 100 100)"/><use href="#petal" transform="rotate(240 100 100)"/>
      <use href="#petal" transform="rotate(270 100 100)"/><use href="#petal" transform="rotate(300 100 100)"/>
      <use href="#petal" transform="rotate(330 100 100)"/>
    </g>
  </svg>
  <div class="om">🕉️</div>
  <h1 data-i="temple"></h1>
  <p data-i="subtitle"></p><br>
  <span class="status-chip"><i></i> <span data-i="serverOn"></span></span>
</header>

<main class="wrap">

  <!-- ================= FORM ================= -->
  <section class="panel">
    <h2>🔔 <span data-i="sendHead"></span></h2>

    <form id="pushForm" onsubmit="handleSendPush(event)">

      <!-- क्लिक एक्शन -->
      <div class="field">
        <span class="lbl" data-i="tapOpens"></span>
        <div class="seg" role="group">
          <button type="button" id="segInternal" class="on" onclick="setMode('internal')">📱 <span data-i="appPage"></span></button>
          <button type="button" id="segExternal" onclick="setMode('external')">🌐 <span data-i="extLink"></span></button>
        </div>

        <!-- ऐप के अंदर का पेज (native जैसा) -->
        <div id="internalBox" class="appshell">
          <div class="appbar">
            <div class="logo">🪷</div>
            <b data-i="temple"></b>
            <small data-i="appBadge"></small>
          </div>
          <div class="apphint" data-i="pickScreen"></div>
          <div class="tiles" id="tiles"></div>
        </div>

        <!-- बाहरी लिंक -->
        <div id="externalBox" class="hidden">
          <input type="url" id="pushCustomUrl" data-ph="urlPh" oninput="updatePreview()">
        </div>
      </div>

      <div class="field">
        <label for="pushTitle" data-i="titleLbl"></label>
        <input type="text" id="pushTitle" data-ph="titlePh" required oninput="updatePreview()">
      </div>

      <div class="field">
        <label for="pushBody" data-i="bodyLbl"></label>
        <textarea id="pushBody" rows="3" data-ph="bodyPh" required oninput="updatePreview()"></textarea>
      </div>

      <div class="field">
        <label for="pushImage" data-i="imgLbl"></label>
        <input type="url" id="pushImage" placeholder="https://.../banner.jpg" oninput="updatePreview()">
      </div>

      <button type="submit" id="submitBtn" class="send"></button>
    </form>

    <div id="diagConsole" class="diag hidden">
      <strong id="diagStatusHead"></strong>
      <div id="diagMessage"></div>
      <small id="diagReason"></small>
      <small id="diagTimestamp"></small>
    </div>
  </section>

  <!-- ================= PREVIEW ================= -->
  <section class="panel">
    <h2>📱 <span data-i="previewHead"></span></h2>

    <div class="phone">
      <div class="cam"></div>
      <div class="clock" id="phoneClock">9:41</div>
      <div class="date" id="phoneDate"></div>

      <div class="notif">
        <div class="notif-top">
          <div class="notif-icon">🪷</div>
          <span data-i="temple"></span>
          <span>• <span data-i="now"></span></span>
        </div>
        <div class="notif-title" id="prevTitle"></div>
        <div class="notif-body" id="prevBody"></div>
        <img id="prevImg" class="notif-img" src="" alt="">
      </div>
    </div>

    <div class="tap-chip" id="tapChip"></div>

    <div style="margin-top:28px">
      <div class="hist-head">
        <b>📜 <span data-i="histHead"></span></b>
        <button type="button" onclick="clearHistory()" data-i="clear"></button>
      </div>
      <div class="hist" id="historyBody"></div>
    </div>
  </section>

</main>

<script>
    // ================= भाषाएँ / Languages =================
    const I18N = {
        hi: {
            locale: 'hi-IN',
            temple: 'श्री श्री राधा कृष्ण चंद्र',

            sendHead: 'सभी भक्तों को नोटिफिकेशन भेजें',

            bodyPh: 'भक्तों के लिए पावन संदेश लिखें...',
            imgLbl: 'बैनर फोटो का लिंक (ज़रूरी नहीं)',
            send: '⚡ सबको अभी भेजें',
            sending: '⏳ भेजा जा रहा है...',

            bodyEmpty: 'आपका संदेश यहाँ दिखेगा...',
            tapOn: '👆 टैप करने पर: ',
            histHead: 'हाल के नोटिफिकेशन',
            clear: 'मिटाएं',
            noHist: 'अभी तक कोई नोटिफिकेशन नहीं भेजा गया।',
            sentOk: '✅ भेजा गया',
            sentFail: '❌ विफल',
            sendingHead: 'भेजा जा रहा है...',
            wait: 'कृपया प्रतीक्षा करें।',
            okHead: '✅ नोटिफिकेशन सभी भक्तों को भेज दिया गया',
            opensOn: 'टैप करने पर खुलेगा: ',
            reached: 'सभी सब्सक्राइबर्स तक पहुंच गया है।',
            failHead: '❌ नहीं भेजा जा सका',
            reason: 'कारण: ',
            unknownErr: 'अज्ञात त्रुटि',

    const SCREEN_ICONS = {
        'index.html': '🏠',
        'daily_darshan.html': '🌸',
        'global_jap.html': '📿',
        'calendar.html': '📅',
        'dono.html': '🙏'
    };
    const SCREEN_ORDER = ['index.html', 'daily_darshan.html', 'global_jap.html', 'calendar.html', 'dono.html'];

    let lang = 'hi';
    let mode = 'internal';
    let selectedScreen = 'index.html';

    function t(key) { return I18N[lang][key]; }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
            {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
        ));
    }

    function setLang(l) {
        lang = I18N[l] ? l : 'hi';
        try { localStorage.setItem('admin_lang', lang); } catch (e) {}
        applyLang();
    }

    function applyLang() {
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
        document.querySelectorAll('[data-ph]').forEach(el => { el.placeholder = t(el.dataset.ph); });
        document.querySelectorAll('.lang-bar button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
        document.getElementById('tickerText').textContent = t('ticker') + '   ' + t('ticker');
        const btn = document.getElementById('submitBtn');
        if (!btn.disabled) btn.textContent = t('send');
        renderTiles();
        updatePreview();
        tickPhone();
        renderHistory();
    }

    // ================= लिंक का नाम (.html कभी नहीं दिखेगा) =================
    function friendlyLinkName(link) {
        if (!link) return t('appOpens');
        if (I18N.hi.screens[link]) return SCREEN_ICONS[link] + ' ' + t('screens')[link];
        try {
            const host = new URL(link).hostname.replace(/^www\./, '');
            if (host.includes('youtube.com') || host === 'youtu.be') return '▶️ YouTube';
            if (host.includes('play.google.com')) return '🛍️ Play Store';
            if (host.includes('instagram.com')) return '📸 Instagram';
            if (host.includes('facebook.com') || host === 'fb.com') return '👥 Facebook';
            if (host.includes('wa.me') || host.includes('whatsapp.com')) return '💬 WhatsApp';
            return '🌐 ' + host;
        } catch (e) {
            return '🌐 ' + t('website');
        }
    }

    // ================= ऐप पेज चुनने वाले टाइल्स =================
    function renderTiles() {
        const box = document.getElementById('tiles');
        box.innerHTML = SCREEN_ORDER.map(key => `
            <button type="button" class="tile ${key === selectedScreen ? 'on' : ''}" data-screen="${key}" onclick="selectScreen('${key}')">
                <span class="ck">✓</span>
                <div class="ic">${SCREEN_ICONS[key]}</div>
                <div class="nm">${esc(t('screens')[key])}</div>
            </button>
        `).join('');
    }

    function selectScreen(key) {
        selectedScreen = key;
        if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
        renderTiles();
        updatePreview();
    }

    function setMode(m) {
        mode = m;
        document.getElementById('segInternal').classList.toggle('on', m === 'internal');
        document.getElementById('segExternal').classList.toggle('on', m === 'external');
        document.getElementById('internalBox').classList.toggle('hidden', m !== 'internal');
        document.getElementById('externalBox').classList.toggle('hidden', m !== 'external');
        updatePreview();
    }

    function getSelectedActionUrl() {
        if (mode === 'external') {
            return document.getElementById('pushCustomUrl').value.trim() || "https://google.com";
        }
        return selectedScreen;
    }

    // ================= लाइव प्रीव्यू =================
    function updatePreview() {
        const title = document.getElementById('pushTitle').value.trim();
        const body = document.getElementById('pushBody').value.trim();
        const img = document.getElementById('pushImage').value.trim();
        const link = getSelectedActionUrl();

        document.getElementById('prevTitle').innerText = title || t('titleEmpty');
        document.getElementById('prevBody').innerText = body || t('bodyEmpty');
        document.getElementById('tapChip').innerText = t('tapOn') + friendlyLinkName(link);

        const prevImg = document.getElementById('prevImg');
        if (img && img.startsWith('http')) {
            prevImg.onerror = () => { prevImg.style.display = 'none'; };
            prevImg.src = img;
            prevImg.style.display = 'block';
        } else {
            prevImg.style.display = 'none';
        }
    }

    function tickPhone() {
        const now = new Date();
        document.getElementById('phoneClock').innerText =
            now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: false });
        document.getElementById('phoneDate').innerText =
            now.toLocaleDateString(t('locale'), { weekday: 'long', day: 'numeric', month: 'long' });
    }

    // ================= भेजना (हमेशा सभी भक्तों को) =================
    async function handleSendPush(e) {
        e.preventDefault();

        const btn = document.getElementById('submitBtn');
        const diagConsole = document.getElementById('diagConsole');
        const diagStatusHead = document.getElementById('diagStatusHead');
        const diagMessage = document.getElementById('diagMessage');
        const diagReason = document.getElementById('diagReason');
        const diagTimestamp = document.getElementById('diagTimestamp');

        const title = document.getElementById('pushTitle').value.trim();
        const body = document.getElementById('pushBody').value.trim();
        const imageUrl = document.getElementById('pushImage').value.trim();
        const actionUrl = getSelectedActionUrl();
        const topic = 'all';   // एक बार में सबको

        btn.disabled = true;
        btn.textContent = t('sending');
        diagConsole.classList.remove('hidden', 'ok', 'err');
        diagStatusHead.innerText = t('sendingHead');
        diagMessage.innerText = t('wait');
        diagReason.innerText = "";
        diagTimestamp.innerText = new Date().toLocaleTimeString();

        try {
            const response = await fetch('/api/send-push', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, body, imageUrl, actionUrl, topic })
            });

            const data = await response.json();
            diagTimestamp.innerText = new Date().toLocaleTimeString();

            if (response.ok && data.success) {
                diagConsole.classList.add('ok');
                diagStatusHead.innerText = t('okHead');
                diagMessage.innerText = t('opensOn') + friendlyLinkName(data.targetLink || actionUrl);
                diagReason.innerText = t('reached');
                saveToHistory({ title, link: data.targetLink || actionUrl, status: 'Success', time: new Date().toLocaleTimeString() });
            } else {
                diagConsole.classList.add('err');
                diagStatusHead.innerText = t('failHead');
                diagMessage.innerText = t('reason') + (data.reason || t('unknownErr'));
                diagReason.innerText = data.details || "";
                saveToHistory({ title, link: actionUrl, status: 'Failed', time: new Date().toLocaleTimeString() });
            }
        } catch (netErr) {
            diagConsole.classList.add('err');
            diagStatusHead.innerText = t('netHead');
            diagMessage.innerText = t('netMsg');
            diagReason.innerText = netErr.message;
            saveToHistory({ title, link: actionUrl, status: 'Gateway Error', time: new Date().toLocaleTimeString() });
        } finally {
            btn.disabled = false;
            btn.textContent = t('send');
        }
    }

    // ================= हिस्ट्री =================
    function saveToHistory(item) {
        let history = [];
        try { history = JSON.parse(localStorage.getItem('fcm_push_history') || '[]'); } catch (e) {}
        history.unshift(item);
        if (history.length > 8) history.pop();
        try { localStorage.setItem('fcm_push_history', JSON.stringify(history)); } catch (e) {}
        renderHistory();
    }

    function renderHistory() {
        const box = document.getElementById('historyBody');
        let history = [];
        try { history = JSON.parse(localStorage.getItem('fcm_push_history') || '[]'); } catch (e) {}

        if (history.length === 0) {
            box.innerHTML = `<div class="empty">${esc(t('noHist'))}</div>`;
            return;
        }

        box.innerHTML = history.map(h => `
            <div class="hist-item ${h.status === 'Success' ? '' : 'fail'}">
                <div>
                    <div class="t">${esc(h.title)}</div>
                    <div class="s">${h.status === 'Success' ? esc(t('sentOk')) : esc(t('sentFail'))} • ${esc(friendlyLinkName(h.link))}</div>
                </div>
                <div class="tm">${esc(h.time)}</div>
            </div>
        `).join('');
    }

    function clearHistory() {
        try { localStorage.removeItem('fcm_push_history'); } catch (e) {}
        renderHistory();
    }

    document.addEventListener('DOMContentLoaded', () => {
        let saved = 'hi';
        try { saved = localStorage.getItem('admin_lang') || 'hi'; } catch (e) {}
        lang = I18N[saved] ? saved : 'hi';
        applyLang();
        setInterval(tickPhone, 30000);
    });
</script>
