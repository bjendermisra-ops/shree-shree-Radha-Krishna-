name: Website quality checks
on:
  push:
    branches:
      - main
      - 'design/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Compile, prerender and verify routes
        run: npm run check
